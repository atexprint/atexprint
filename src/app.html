<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" type="image/x-icon" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>

		<!-- HTML Meta Tags -->
		<title>ATEX</title>
		<meta
			name="description"
			content="ATEX - experts in printing on knitted and polyester fabrics. 20 years of experience."
		/>

		<!-- Facebook Meta Tags -->
		<meta property="og:url" content="https://www.atexprint.pl/" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="ATEX" />
		<meta
			property="og:description"
			content="ATEX - experts in printing on knitted and polyester fabrics. 20 years of experience."
		/>
		<meta property="og:image" content="https://atexprint.pl/og_image.png" />

		<!-- Twitter Meta Tags -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta property="twitter:domain" content="atexprint.pl" />
		<meta property="twitter:url" content="https://www.atexprint.pl/" />
		<meta name="twitter:title" content="ATEX" />
		<meta
			name="twitter:description"
			content="ATEX - experts in printing on knitted and polyester fabrics. 20 years of experience."
		/>
		<meta name="twitter:image" content="https://atexprint.pl/og_image.png" />

		<!-- Font awesome icons -->
		<script src="/fontawesome/fontawesome.min.js"></script>
		<script src="/fontawesome/all.min.js"></script>

		<!-- hCaptcha -->
		<script src="https://js.hcaptcha.com/1/api.js" async defer></script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="montserrat">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
